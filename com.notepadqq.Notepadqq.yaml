app-id: com.notepadqq.Notepadqq
runtime: org.kde.Platform
runtime-version: '6.11'
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
sdk: org.kde.Sdk
command: notepadqq
rename-icon: notepadqq
rename-desktop-file: notepadqq.desktop
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Filesystem access
  # for Open Folder
  - --filesystem=home
  # Host command access
  # for flatpak-spawn
  # Allow to run commands from the host
  - --talk-name=org.freedesktop.Flatpak
  # OpenGL access
  # for QtWebKit (stable release) or QtWebEngine (beta release)
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
cleanup:
  - /share/man

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # Required by: notepadqq
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
        x-checker-data:
          type: anitya
          project-id: 9265
          stable-only: true
          url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz

  - name: notepadqq
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/notepadqq/notepadqq/archive/refs/tags/v2.1.0.tar.gz
        sha256: 7c06b077f19d2937bbc40b46ddb0a32611b7314078381a8aed989471061bc3e1
        x-checker-data:
          is-main-source: true
          type: anitya
          project-id: 12071
          stable-only: true
          url-template: https://github.com/notepadqq/notepadqq/archive/refs/tags/v$version.tar.gz
